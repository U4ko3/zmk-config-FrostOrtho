# ========================================
# 基本設定
# ========================================
CONFIG_ZMK_KEYBOARD_NAME="FrostOrtho"
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_SPI=y
CONFIG_INPUT=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

# zmk-rgbled-widgetを使用してバッテリー残量をLEDで確認する
# CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
# CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# Bluetooth接続設定
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ========================================
# ZMK Studio（必須ベース）
# ========================================
CONFIG_ZMK_STUDIO=y
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する必要があります。
# 詳細は「BLE 接続」セクションを参照。

# BLE 接続スロット（プロファイル + Peripheral + Studio）
# CONFIG_BT_MAX_CONN=5
# CONFIG_BT_MAX_PAIRED=5

# ========================================
# DYA Studio モジュール（Central 側）
# ========================================
# Custom Settings（設定永続化の共通基盤）
# runtime-input-processor / runtime-combo / runtime-macro がこの上に乗る
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# ランタイムマクロ本体（最大256バイト）を保存できるようにする
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Settings RPC（アイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split イベントリレー（Central <-> Peripheral 設定同期）
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にすること
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# Runtime Input Processor（トラックボール）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Runtime sensor rotate（エンコーダ）
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y
# 保存済みの behavior ID を解決するために必要
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y

# Runtime Combo（DYA Studio からコンボを追加・編集・削除）
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50

# Runtime Macro（DYA Studio からマクロを作成・編集・削除）
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# ランタイムマクロは behavior local ID で束縛を保存するため CRC16 が必要
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# ========================================
# マウスジェスチャー（DYA Studio から編集）
# ========================================
# DYA Studio の Subsystems ページに cormoran__mouse_gesture として表示され、
# 専用 Web UI からジェスチャー / ストロークサイズ / 慣性スクロール等を変更・保存できる。
CONFIG_ZMK_MOUSE_GESTURE_RPC=y
# ジェスチャーセット数（&mg_set 0〜N-1 / &mg_kp N <tap>）
CONFIG_ZMK_MOUSE_GESTURE_RPC_NUM_SETS=3

# ========================================
# DYA Studio 診断タブ
# ========================================
# キースイッチ（キー押下統計・チャタリング検出）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48

# キースイッチ診断のライブ表示
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# スタック使用量
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y

# デバイス情報
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# 安定性（ウォッチドッグ）
# NOTE: FREEZE_DETECT（既定で有効）はシステムワークキューが 10 秒以上詰まると
#       インシデントを記録して再起動する。不要なら CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Zephyr settings の閲覧
CONFIG_ZMK_SETTING_EXPOSE=y

# Studio RPC の性能計測
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y

# ========================================
# Studio RPC のバッファ / スタック
# ========================================
# 大きすぎるバッファは nRF52840 で 5 レイヤー以上のキーマップ読み込みが固まるため控えめに
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
# マウスジェスチャー / runtime-combo / runtime-macro の custom RPC ペイロード
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
# custom RPC を増やしたことによるスタック調整（cormoran/zmk-keyboard-dya2 v2.0 と同じ値）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# Settings storage
CONFIG_SETTINGS=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 無線イベントの準備が遅れた場合はそのイベントを中止して継続する
# （Zephyr 4.1 の LL_ASSERT_OVERHEAD による再起動を回避）
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# zmk-rgbled-widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=3
